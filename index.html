<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLife — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-panel panel">
        <!-- Logo -->
        <div class="brand auth-brand">
            <div class="brand-mark">
                <span></span><span></span><span></span>
            </div>
            <div>
                <strong>Safe<span>Life</span></strong>
                <small>your daily companion</small>
            </div>
        </div>

        <div class="panel-header auth-header">
            <div>
                <p class="eyebrow">BEM-VINDO DE VOLTA</p>
                <h2>Acesse sua conta</h2>
            </div>
        </div>

        <form action="dashboard.html" method="GET" class="auth-form">
            <div class="input-group">
                <label class="nav-label">E-MAIL</label>
                <input type="email" placeholder="seu@email.com" required class="auth-input">
            </div>
            
            <div class="input-group">
                <label class="nav-label">SENHA</label>
                <input type="password" placeholder="••••••••" required class="auth-input">
            </div>

            <button type="submit" class="auth-btn">Entrar no Dashboard <span>→</span></button>
        </form>

        <div class="auth-footer">
            <span class="nav-label" style="margin:0; padding:0;">NOVO POR AQUI?</span>
            <a href="cadastro.html" class="text-button" style="margin:0;">Criar uma conta <span>→</span></a>
        </div>
    </main>

    <!-- Script para manter o tema (Dark/Light) salvo no localStorage -->
    <script>
        if (localStorage.getItem("healthtrack-theme") === "dark") {
            document.body.classList.add("dark");
        }
    </script>
</body>
</html>
